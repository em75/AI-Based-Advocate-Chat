{% extends 'common.html' %}
{% load static %}
{% block title %}Login - AdvoBook{% endblock %}
{% block header %}

<style>
.contact-section {
    padding: 80px 0;
}

/* Elite Card */
.contact-form {
    background: linear-gradient(135deg, #111827, #1e293b) !important;
    border-radius: 20px !important;
    box-shadow: 0 25px 70px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;

    margin: auto;
    width: 100%;
    max-width: 420px;
    padding-bottom: 50px !important;
}

/* Gold top border */
.contact-form::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, #d4af37, #f5d76e, #d4af37);
}

/* Title */
.contact-form h2 {
    color: #f5d76e;
    font-size: 24px;
}

/* Labels */
.contact-form label {
    color: #cbd5e1;
    font-size: 13px;
    margin-bottom: 4px;
    display: block;
    text-align: left;
    width: 85%;
    margin-left: auto;
    margin-right: auto;
}

/* Inputs */
.contact-form .form-control {
    border-radius: 10px;
    border: 1px solid #334155;
    background: #1e293b;
    color: white;
    font-size: 13px;
    padding: 10px 12px;
    margin-bottom: 15px;

    width: 85%;
    margin-left: auto;
    margin-right: auto;
    display: block;
}

/* Focus */
.contact-form .form-control:focus {
    border-color: #d4af37;
    box-shadow: 0 0 0 2px rgba(212,175,55,0.25);
}

/* Button */
.contact-form .btn-danger {
    background: linear-gradient(135deg, #d4af37, #b8860b);
    border: none;
    color: #111;
    font-weight: 600;
    border-radius: 10px;
    padding: 10px 35px;
    font-size: 14px;
}

.contact-form .btn-danger:hover {
    background: linear-gradient(135deg, #f5d76e, #d4af37);
}
/* Bubble */
.bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(212,175,55,0.10);
    pointer-events: none;
}
/* ===== Subtle Premium Shine ===== */

.contact-form {
    position: relative;
    overflow: hidden;
}
/* Subtle Shine */
.contact-form::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        120deg,
        rgba(255,255,255,0.05),
        transparent 40%,
        transparent 60%,
        rgba(255,255,255,0.03)
    );
    pointer-events: none;
}


</style>

<section class="ftco-section contact-section">
<div class="container">
<div class="row justify-content-center">

<div class="col-lg-6">

<form method="post" enctype="multipart/form-data"
      class="p-5 contact-form" id="box">

{% csrf_token %}

<center>
    <h2><b>Login</b></h2><br>
</center>

<div class="form-group">
    <label>Email</label>
    <input type="email" class="form-control"
           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
           name="email" placeholder="Enter your email" required>
</div>

<div class="form-group">
    <label>Password</label>
    <input type="password" class="form-control"
           name="password" placeholder="Enter your password" required>
</div>

<center>
<div class="form-group">
    <input type="submit" value="Login"
           class="btn btn-danger py-3 px-5">
</div>
<div class="form-group">
    <a href="/forgot_password_request/">Forgot Password?</a>
</div>
</center>

</form>

</div>
</div>
</div>
</section>

<!-- ✅ Bubble Animation -->
<script>
window.addEventListener("load", () => {

    const box = document.getElementById("box");
    const bubbleCount = 7;
    const bubbles = [];

    for (let i = 0; i < bubbleCount; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");

        const size = Math.random() * 50 + 25;
        bubble.style.width = size + "px";
        bubble.style.height = size + "px";

        box.appendChild(bubble);

        bubbles.push({
            el: bubble,
            x: Math.random() * (box.clientWidth - size),
            y: Math.random() * (box.clientHeight - size),
            dx: (Math.random() - 0.5) * 1.6,
            dy: (Math.random() - 0.5) * 1.6,
            size: size
        });
    }

    function resolveCollision(b1, b2) {
        const dx = b2.x - b1.x;
        const dy = b2.y - b1.y;
        const distance = Math.sqrt(dx * dx + dy * dy);
        const minDist = (b1.size / 2) + (b2.size / 2);

        if (distance < minDist) {
            const angle = Math.atan2(dy, dx);
            const overlap = minDist - distance;

            b1.x -= Math.cos(angle) * overlap / 2;
            b1.y -= Math.sin(angle) * overlap / 2;
            b2.x += Math.cos(angle) * overlap / 2;
            b2.y += Math.sin(angle) * overlap / 2;

            const tempDx = b1.dx;
            const tempDy = b1.dy;
            b1.dx = b2.dx;
            b1.dy = b2.dy;
            b2.dx = tempDx;
            b2.dy = tempDy;
        }
    }

    function animate() {
        bubbles.forEach(b => {
            b.x += b.dx;
            b.y += b.dy;

            if (b.x <= 0 || b.x + b.size >= box.clientWidth) b.dx *= -1;
            if (b.y <= 0 || b.y + b.size >= box.clientHeight) b.dy *= -1;

            b.el.style.left = b.x + "px";
            b.el.style.top = b.y + "px";
        });

        for (let i = 0; i < bubbles.length; i++) {
            for (let j = i + 1; j < bubbles.length; j++) {
                resolveCollision(bubbles[i], bubbles[j]);
            }
        }

        requestAnimationFrame(animate);
    }

    animate();
});
</script>

{% endblock %}
