{% extends 'common.html' %}
{% load static %}
{% block title %}Reset Password - AdvoBook{% endblock %}
{% block header %}

<section class="ftco-section contact-section">
    <div class="container">
        <div class="row block-9">
            <div class="col-md-2"></div>
            
            <div class="col-lg-8 order-md-last d-flex">
                <form method="post" class="p-5 contact-form" style="background-color: rgb(225, 235, 243); border-radius: 10px; width: 100%;" onsubmit="return validatePasswords()">
                    {% csrf_token %}
                    <center><h2><b>Reset Password</b></h2>
                    <p>Enter your new password below.</p><br></center>
                    
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="new_password" class="form-control" name="new_password" placeholder="New Password" required minlength="8">
                        <small class="form-text text-muted">Password must be at least 8 characters long.</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirm_password" class="form-control" name="confirm_password" placeholder="Confirm New Password" required>
                    </div>
                    
                    <center>
                    <div class="form-group">
                        <input type="submit" value="Reset Password" class="btn btn-danger py-3 px-5">
                    </div>
                </center>
                </form>

            </div>
        </div>
    </div>
</section>

<script>
function validatePasswords() {
    var pass1 = document.getElementById("new_password").value;
    var pass2 = document.getElementById("confirm_password").value;
    if (pass1 != pass2) {
        alert("Passwords do not match!");
        return false;
    }
    return true;
}
</script>

{% endblock %}
