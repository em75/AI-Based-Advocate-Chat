{% extends 'common.html' %}
{% load static %}
{% block title %}Forgot password - AdvoBook{% endblock %}
{% block header %}

<section class="ftco-section contact-section">
    <div class="container">
        <div class="row block-9">
            <div class="col-md-2"></div>
            
            <div class="col-lg-8 order-md-last d-flex">
                <form method="post" class="p-5 contact-form" style="background-color: rgb(225, 235, 243); border-radius: 10px; width: 100%;">
                    {% csrf_token %}
                    <center><h2><b>Forgot Password</b></h2>
                    <p>Enter your registered email address to receive an OTP.</p><br></center>
                    <div class="form-group">
                        <input type="email" class="form-control" name="email" placeholder="Your Registered Email" required>
                    </div>
                    
                    <center>
                    <div class="form-group">
                        <input type="submit" value="Send OTP" class="btn btn-danger py-3 px-5">
                    </div>
                    <div>
                        <a href="/login/">Back to Login</a>
                    </div>
                </center>
                </form>

            </div>
        </div>
    </div>
</section>

{% endblock %}
